# Pinned because `packages/compiler/wasm/` is a COMMITTED build artifact and CI
# verifies it by rebuilding and diffing. That check is only meaningful against
# the exact toolchain that produced the committed bytes — a floating channel
# would make the job permanently red for reasons unrelated to any real drift.
#
# This combination was verified to rebuild the artifact byte-identically:
#   rustc 1.93.1 + wasm-pack 0.15.0 + wasm-bindgen 0.2.126
#
# wasm-bindgen is a caret range in crates/indigo-compiler/Cargo.toml; what
# actually holds it at 0.2.126 is the committed crates/Cargo.lock, which is why
# every cargo invocation in CI passes --locked. Never run `cargo update` in CI.
#
# Bumping any of these is an explicit change that must regenerate and commit the
# artifact in the same commit.
[toolchain]
channel = "1.93.1"
targets = ["wasm32-unknown-unknown"]
