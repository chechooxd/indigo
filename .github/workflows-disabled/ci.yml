# DISABLED (2026-08-26): moved out of .github/workflows/ so GitHub Actions
# stops picking it up entirely — this repo is private and pre-product, and
# running this on every push/PR was billed against real money for no
# reader yet. To re-enable: `git mv .github/workflows-disabled/ci.yml
# .github/workflows/ci.yml` and push. Until then, use `pnpm build && pnpm
# lint && pnpm test` and `scripts/test-postgres.sh` locally before pushing.
#
# CI floor for IndigoDB.
#
# Four jobs, deliberately independent (no `needs:`) so one red job never hides
# another:
#
#   ts          build + lint + test. Installs NO Rust toolchain, on purpose.
#   rust        cargo test against the pinned toolchain.
#   wasm-drift  rebuilds the committed WASM artifact. CI IS THE SOURCE OF TRUTH
#               for its bytes — see below.
#   postgres    real Postgres (`wal_level=logical`) for @@realtime's WAL
#               logical-replication suites — see its own header below.
#
# Why the TS job must stay Rust-free: `packages/compiler/wasm/` is a committed
# build artifact precisely so a TypeScript-only contributor never needs cargo or
# wasm-pack. If this job ever grows a Rust step, that property is silently gone
# and committing the artifact stops buying anything.
#
# CI is the source of truth for the WASM artifact's exact bytes, not any
# contributor's machine. The first real run of wasm-drift found that even an
# identical rustc + wasm-pack + wasm-bindgen still produces different bytes on
# macOS vs this Linux runner — low-level LLVM/rustc codegen ordering, not a
# path leak (that part is fixed: RUSTFLAGS=--remap-path-prefix in build:wasm
# strips $HOME/.cargo/registry/src). Chasing full cross-host byte-determinism
# from here is a much deeper rabbit hole (hermetic builds, forced single-
# threaded codegen) than "pin the toolchain" turned out to be, so on `push` to
# `main` this job self-heals instead of just failing: it rebuilds, and if the
# committed bytes differ, it commits ITS OWN rebuild back to `main` as
# `github-actions[bot]` and stops there — that run itself still finishes green,
# because the bytes it just committed ARE its own build output by construction.
#
# That push does NOT trigger a fresh CI run: GitHub deliberately does not
# chain workflow runs off a push made with the default GITHUB_TOKEN, to avoid
# infinite-loop workflows. No verification run happens automatically, and none
# is needed — `main` is self-consistent the moment the commit lands, since
# nothing outside this job produced those bytes. The next PUSH BY A HUMAN is
# what actually re-exercises the check, against a same-runner-pool baseline
# instead of a laptop's. A commit already authored by `github-actions[bot]`
# skips the auto-fix (loop guard) — if THAT still fails to match on rebuild,
# something is genuinely wrong, not host noise, and the job fails loudly
# instead of committing forever.
#
# On `pull_request`, this job never pushes (unsafe for fork branches, and
# ambiguous for same-repo branches while a review is pending): it only reports
# whether the PR's own Rust changes look consistent, and directs contributors
# to trust whatever `main` has after merge — never to hand-verify their local
# rebuild against the committed bytes, which cross-host noise makes unreliable
# by design.
#
# Known limitation: `build:wasm` uses `$(pwd)` and `rm -f`, which is correct on
# this Linux runner and on Unix dev machines but would need adjusting before a
# Windows runner could be added to any matrix.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ts:
    name: TypeScript (build · lint · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm lint

      # Includes the PGlite appliability suite, which boots an in-process
      # PostgreSQL per fixture and adds roughly 70s. No service container and no
      # Docker: PGlite is an ordinary npm dependency.
      - run: pnpm test

  rust:
    name: Rust (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup is preinstalled on the runner and reads rust-toolchain.toml, so
      # the pinned channel and the wasm32 target install themselves on first use.
      - name: Report the resolved toolchain
        run: rustc --version && cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: cargo-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # --locked is what actually pins wasm-bindgen: the manifest carries a caret
      # range and only the committed Cargo.lock holds it at 0.2.126. This also
      # fails loudly if someone edits Cargo.toml without updating the lockfile.
      - run: cargo test --locked
        working-directory: crates

  wasm-drift:
    name: WASM artifact integrity
    runs-on: ubuntu-latest
    # Only this job needs write access, and only to self-heal the artifact on
    # a direct push — the other two jobs stay read-only under the workflow's
    # default `permissions: contents: read`.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # A plain checkout token can't push. persist-credentials keeps the
          # default GITHUB_TOKEN wired into git for the auto-commit step below.
          persist-credentials: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            crates/target
          key: wasm-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: wasm-${{ runner.os }}-

      - name: Install the pinned wasm-pack
        run: |
          if [ "$(wasm-pack --version 2>/dev/null)" != "wasm-pack 0.15.0" ]; then
            cargo install wasm-pack --version 0.15.0 --locked
          fi

      - run: pnpm install --frozen-lockfile

      - name: Rebuild the artifact
        run: pnpm --filter @indigodb/compiler build:wasm

      - name: Check whether it matches the committed bytes
        id: diff
        run: |
          if git diff --exit-code --quiet -- packages/compiler/wasm/; then
            echo "matches=true" >> "$GITHUB_OUTPUT"
            echo "CI's rebuild matches the committed artifact."
          else
            echo "matches=false" >> "$GITHUB_OUTPUT"
            echo "CI's rebuild differs from the committed artifact."
          fi

      # Push-only, and only once: a commit already authored by the bot means
      # we already tried to self-heal and it still didn't match, so this is
      # real drift or a genuine build problem, not cross-host noise — fail
      # instead of committing forever.
      - name: "Self-heal on push (loop guard: skip if the last commit is already ours)"
        if: >
          steps.diff.outputs.matches == 'false' &&
          github.event_name == 'push' &&
          github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/compiler/wasm/
          git commit -m "chore(wasm): sync artifact rebuilt by CI

          CI is the source of truth for this artifact's exact bytes (see the
          workflow file header): identical rustc/wasm-pack/wasm-bindgen still
          produce different bytes on different host machines, so no
          contributor's local rebuild is compared here. This commit is that
          rebuild, made canonical by running in CI."
          git push origin HEAD:${{ github.ref_name }}
          echo "::notice::Committed CI's own rebuild to ${{ github.ref_name }}. GitHub does not chain a new run off a GITHUB_TOKEN push, so no follow-up run will appear — that's expected, not a gap: the committed bytes are this run's own build output."

      - name: Report drift that self-heal did not (or could not) fix
        if: steps.diff.outputs.matches == 'false' && (github.event_name != 'push' || github.actor == 'github-actions[bot]')
        run: |
          if [ "${{ github.actor }}" = "github-actions[bot]" ]; then
            echo "::error::CI's own commit still doesn't match its own rebuild. This is not cross-host noise — investigate a genuine build non-determinism or environment problem before merging."
          else
            echo "::error::packages/compiler/wasm/ does not match a rebuild from crates/indigo-compiler/src on this pull request."
            echo ""
            echo "This is expected to happen on PRs that touch crates/ — CI only self-heals on"
            echo "push to main (pushing to a PR branch, especially from a fork, isn't safe here)."
            echo "Once this merges to main, CI will commit its own rebuild automatically."
            echo "If crates/ was NOT touched by this PR, something else is wrong: rerun the job"
            echo "or investigate before merging."
          fi
          exit 1

  # Real Postgres with `wal_level=logical` for @@realtime's WAL
  # logical-replication suites — `packages/realtime`'s `parity`/`resume`
  # (PR A) plus `packages/migrator`'s replication-DDL tests (PR B), all
  # gated on `INDIGODB_TEST_DATABASE_URL` so they self-skip everywhere else
  # (`ts` stays Postgres-free by construction, per that job's own comment).
  #
  # Deliberately a `docker run` STEP, not a `services:` container:
  # `services.<id>.options` maps to `docker create` flags and cannot pass a
  # container COMMAND, so `-c wal_level=logical` is unreachable from
  # `services:` — Postgres would default to `wal_level=replica` and every
  # gated suite would either fail or (correctly) self-skip on a preflight
  # that never gets exercised. `docker run -d ... -c wal_level=logical`
  # passes it directly as the container's command argument.
  postgres:
    name: PostgreSQL (wal_level=logical)
    runs-on: ubuntu-latest
    # No `needs:` — isolated from ts/rust/wasm-drift, mirroring the `rust`
    # job. Default `permissions: contents: read` from the top of this file;
    # this job never pushes.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Start Postgres 17 with wal_level=logical
        run: |
          docker run -d --name indigo-wal-ci \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=indigo_test \
            -p 55432:5432 \
            postgres:17 \
            -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4

      - name: Wait for Postgres to accept connections
        run: |
          for i in $(seq 1 30); do
            if docker exec indigo-wal-ci pg_isready -U postgres >/dev/null 2>&1; then
              echo "Postgres is ready."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Postgres did not become ready within 30s."
          docker logs indigo-wal-ci
          exit 1

      - name: Run real-Postgres realtime + migrator replication-DDL suites
        timeout-minutes: 5
        env:
          INDIGODB_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/indigo_test
        run: |
          pnpm --filter @indigodb/realtime test
          pnpm --filter @indigodb/migrator test

      - name: Stop Postgres
        if: always()
        run: docker rm -f indigo-wal-ci
