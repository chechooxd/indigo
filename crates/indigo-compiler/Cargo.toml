[package]
name = "indigo-compiler"
version = "0.1.0"
edition = "2021"
description = "IndigoDB .indigo schema compiler: lexer, parser, resolver and validator, compiled to WASM."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
logos = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
